<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Mobile Voice Notes Auto-Save</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root {
    --right-width: 30%;
    --line-top: 25%;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }

  #layout {
    display: grid;
    grid-template-columns: minmax(0, calc(100% - var(--right-width))) var(--right-width);
    height: 100%;
  }

  /* LEFT: notes above the horizontal line */
  #left {
    position: relative;
    background: #fff;
  }

  #h-line {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--line-top);
    height: 1px;
    background: #777;
  }

  #notes-box {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: calc(100% - var(--line-top));
    overflow-y: auto;
    padding: 6px;
    box-sizing: border-box;
  }

  #notes-box h2 {
    margin: 0 0 6px 0;
    font-size: 14px;
  }

  .note-item {
    border: 1px solid #ddd;
    padding: 4px;
    margin-bottom: 4px;
    font-size: 13px;
  }

  .note-label {
    font-size: 12px;
    color: #555;
    margin-bottom: 4px;
  }

  audio {
    width: 100%;
  }

  /* RIGHT: scrollable, big toggle button */
  #right {
    border-left: 1px solid #888;
    overflow-y: auto;
    position: relative;
    background: #fff;
  }

  #right-inner {
    position: relative;
    min-height: 100%;
    padding: 12px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    gap: 10px;
  }

  #recordButton {
    padding: 18px;
    font-size: 18px;
    border-radius: 8px;
    border: none;
    background: #e53935;
    color: #fff;
    text-align: center;
    width: 100%;
  }

  #recordButton.recording {
    background: #388e3c;
  }

  #record-status {
    font-size: 13px;
    color: #b00;
    min-height: 18px;
  }
</style>
</head>
<body>

<div id="layout">
  <!-- LEFT: notes container above the line -->
  <div id="left">
    <div id="notes-box">
      <h2>Voice notes</h2>
      <div id="notes-list"></div>
    </div>
    <div id="h-line"></div>
  </div>

  <!-- RIGHT: mobile-friendly single button -->
  <div id="right">
    <div id="right-inner">
      <button id="recordButton">Start recording</button>
      <div id="record-status"></div>
    </div>
  </div>
</div>

<script>
(function () {
  var recordButton = document.getElementById('recordButton');
  var statusSpan = document.getElementById('record-status');
  var notesList = document.getElementById('notes-list');

  var mediaRecorder = null;
  var chunks = [];
  var isRecording = false;
  var noteCounter = 1;

  function setRecordingUI(on) {
    isRecording = on;
    if (on) {
      recordButton.textContent = 'Stop recording';
      recordButton.classList.add('recording');
    } else {
      recordButton.textContent = 'Start recording';
      recordButton.classList.remove('recording');
    }
  }

  function appendNote(blob) {
    var item = document.createElement('div');
    item.className = 'note-item';

    var label = document.createElement('div');
    label.className = 'note-label';
    label.textContent = 'Note ' + noteCounter;
    item.appendChild(label);

    var audio = document.createElement('audio');
    audio.controls = true;
    audio.src = URL.createObjectURL(blob);
    item.appendChild(audio);

    notesList.insertBefore(item, notesList.firstChild);
    noteCounter++;
  }

  function triggerDownload(blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    // use timestamp for unique filename
    var ts = new Date().toISOString().replace(/[:.]/g, '-');
    a.download = 'voice-note-' + ts + '.webm';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  recordButton.addEventListener('click', function () {
    if (!isRecording) {
      // START recording
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        statusSpan.textContent = 'Recording not supported in this browser.';
        return;
      }
      statusSpan.textContent = '';
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
        chunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = function (e) {
          if (e.data && e.data.size > 0) chunks.push(e.data);
        };
        mediaRecorder.onstop = function () {
          var blob = new Blob(chunks, { type: 'audio/webm' });
          appendNote(blob);       // show in top box
          triggerDownload(blob);  // auto download for protection
          statusSpan.textContent = 'Note saved.';
          stream.getTracks().forEach(function (t) { t.stop(); });
        };
        mediaRecorder.start();
        statusSpan.textContent = 'Recording...';
        setRecordingUI(true);
      }).catch(function () {
        statusSpan.textContent = 'Microphone access denied or unavailable.';
      });
    } else {
      // STOP recording
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
      setRecordingUI(false);
    }
  });
})();
</script>

</body>
</html>
