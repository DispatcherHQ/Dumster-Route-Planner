<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Adjustable Voice Notes Grid with Extras</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root {
    --right-width: 30%;
    --line-top: 25%;
    --btn-height: 48px; /* default button height */
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }

  #controls {
    padding: 6px;
    font-size: 14px;
    border-bottom: 1px solid #ccc;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  #controls input {
    width: 60px;
  }

  #fullscreenBtn {
    padding: 2px 8px;
    font-size: 12px;
  }

  #layout {
    display: grid;
    grid-template-columns: minmax(0, calc(100% - var(--right-width))) var(--right-width);
    height: calc(100% - 40px);
  }

  /* LEFT: notes above the horizontal line */
  #left {
    position: relative;
    background: #fff;
  }

  #h-line {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--line-top);
    height: 1px;
    background: #777;
  }

  #notes-box {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: calc(100% - var(--line-top));
    overflow-y: auto;
    padding: 6px;
    box-sizing: border-box;
  }

  #notes-box h2 {
    margin: 0 0 6px 0;
    font-size: 14px;
  }

  .note-item {
    border: 1px solid #ddd;
    padding: 4px;
    margin-bottom: 4px;
    font-size: 13px;
  }

  .note-label {
    font-size: 12px;
    color: #555;
    margin-bottom: 4px;
  }

  audio {
    width: 100%;
  }

  /* bottom-left "map" area: under the line */
  #map-area {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--line-top);
    bottom: 0;
    display: flex;
    align-items: flex-end;
    justify-content: flex-start;
    pointer-events: none; /* visual only for now */
  }

  #map-label {
    margin: 6px;
    padding: 4px 8px;
    border: 1px dashed #999;
    font-size: 13px;
    color: #555;
    background: #f9f9f9;
  }

  /* RIGHT: scrollable with buttons */
  #right {
    border-left: 1px solid #888;
    overflow-y: auto;
    position: relative;
    background: #fff;
  }

  #right-inner {
    position: relative;
    min-height: 100%;
    padding: 12px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    gap: 10px;
  }

  .btn-like {
    width: 100%;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    color: #fff;
    text-align: center;
    height: var(--btn-height);
  }

  #recordButton {
    background: #e53935;
  }

  #recordButton.recording {
    background: #388e3c;
  }

  #recordButton.playing {
    background: #f9a825;
  }

  /* dummy buttons */
  #dummyBtn1 {
    background: #5e35b1;
  }

  #dummyBtn2 {
    background: #5e35b1;
  }

  #dummyBtn3 {
    background: #5e35b1;
  }

  #dummyBtn4 {
    background: #5e35b1;
  }

  #record-status {
    font-size: 13px;
    color: #b00;
    min-height: 18px;
  }
</style>
</head>
<body>

<div id="controls">
  Right width (%):
  <input id="rightWidthInput" type="number" min="10" max="100" value="30">
  Line top (%):
  <input id="lineTopInput" type="number" min="10" max="100" value="25">
  Button height (px):
  <input id="btnHeightInput" type="number" min="32" max="500" value="48">
  <button id="fullscreenBtn">Full screen</button>
</div>

<div id="layout">
  <!-- LEFT: notes container above the line + map below -->
  <div id="left">
    <div id="notes-box">
      <h2>Voice notes</h2>
      <div id="notes-list"></div>
    </div>
    <div id="h-line"></div>
    <div id="map-area">
      <div style="width: 800px; height: 400px; text-align: center; font-size: 200px;">MAP</div>
    </div>
  </div>

  <!-- RIGHT: mobile-friendly buttons -->
  <div id="right">
    <div id="right-inner">
      <button id="recordButton" class="btn-like">Start recording</button>
      <button id="dummyBtn1" class="btn-like">Dummy button 1</button>
      <button id="dummyBtn2" class="btn-like">Dummy button 2</button>
      <button id="dummyBtn3" class="btn-like">Dummy button 3</button>
      <button id="dummyBtn4" class="btn-like">Dummy button 4</button>
      <div id="record-status"></div>
    </div>
  </div>
</div>

<script>
(function () {
  // numeric adjustability for columns, line, and button height
  var root = document.documentElement;
  var rightWidthInput = document.getElementById('rightWidthInput');
  var lineTopInput = document.getElementById('lineTopInput');
  var btnHeightInput = document.getElementById('btnHeightInput');

  function updateRightWidth() {
    var val = parseFloat(rightWidthInput.value);
    rightWidthInput.value = val;
    root.style.setProperty('--right-width', val + '%');
  }

  function updateLineTop() {
    var val = parseFloat(lineTopInput.value);
    lineTopInput.value = val;
    root.style.setProperty('--line-top', val + '%');
  }

  function updateBtnHeight() {
    var val = parseFloat(btnHeightInput.value);
    btnHeightInput.value = val;
    root.style.setProperty('--btn-height', val + 'px');
  }

  rightWidthInput.addEventListener('input', updateRightWidth);
  lineTopInput.addEventListener('input', updateLineTop);
  btnHeightInput.addEventListener('input', updateBtnHeight);

  updateRightWidth();
  updateLineTop();
  updateBtnHeight();

  // fullscreen toggle
  var fullscreenBtn = document.getElementById('fullscreenBtn');
  fullscreenBtn.addEventListener('click', function () {
    if (!document.fullscreenElement) {
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
      }
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
  });

  // recording + playback
  var recordButton = document.getElementById('recordButton');
  var statusSpan = document.getElementById('record-status');
  var notesList = document.getElementById('notes-list');

  var mediaRecorder = null;
  var chunks = [];
  var state = 'idle'; // 'idle' | 'recording' | 'playing'
  var lastAudioElement = null;
  var noteCounter = 1;

  function setButtonState(newState) {
    state = newState;
    recordButton.classList.remove('recording', 'playing');
    if (state === 'idle') {
      recordButton.textContent = 'Start recording';
    } else if (state === 'recording') {
      recordButton.textContent = 'Stop recording';
      recordButton.classList.add('recording');
    } else if (state === 'playing') {
      recordButton.textContent = 'Stop replay';
      recordButton.classList.add('playing');
    }
  }

  function appendNote(blob) {
    var item = document.createElement('div');
    item.className = 'note-item';

    var label = document.createElement('div');
    label.className = 'note-label';
    label.textContent = 'Note ' + noteCounter;
    item.appendChild(label);

    var audio = document.createElement('audio');
    audio.controls = true;
    audio.src = URL.createObjectURL(blob);
    item.appendChild(audio);

    notesList.insertBefore(item, notesList.firstChild);
    noteCounter++;

    return audio;
  }

  function triggerDownload(blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var ts = new Date().toISOString().replace(/[:.]/g, '-');
    a.href = url;
    a.download = 'voice-note-' + ts + '.webm';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  recordButton.addEventListener('click', function () {
    if (state === 'idle') {
      // start recording
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        statusSpan.textContent = 'Recording not supported in this browser.';
        return;
      }
      statusSpan.textContent = '';
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
        chunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = function (e) {
          if (e.data && e.data.size > 0) chunks.push(e.data);
        };
        mediaRecorder.onstop = function () {
          var blob = new Blob(chunks, { type: 'audio/webm' });
          lastAudioElement = appendNote(blob);
          triggerDownload(blob);
          statusSpan.textContent = 'Note saved and downloading...';
          stream.getTracks().forEach(function (t) { t.stop(); });

          if (lastAudioElement) {
            setButtonState('playing');
            lastAudioElement.currentTime = 0;
            lastAudioElement.play().catch(function(){});
            lastAudioElement.onended = function () {
              if (state === 'playing') {
                setButtonState('idle');
              }
            };
          } else {
            setButtonState('idle');
          }
        };
        mediaRecorder.start();
        statusSpan.textContent = 'Recording...';
        setButtonState('recording');
      }).catch(function () {
        statusSpan.textContent = 'Microphone access denied or unavailable.';
      });

    } else if (state === 'recording') {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }

    } else if (state === 'playing') {
      if (lastAudioElement) {
        lastAudioElement.pause();
        lastAudioElement.currentTime = 0;
      }
      setButtonState('idle');
      statusSpan.textContent = '';
    }
  });

  setButtonState('idle');
})();
</script>

</body>
</html>
